<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Career Atlas — Choose the role. See the path.</title>
<meta name="description" content="An interactive knowledge map for IT careers: explore roles, skills, topics, projects and interview prep, and track your path to job-ready.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#FFFFFF;
  --bg-soft:#F6F9F8;
  --surface:#FFFFFF;
  --surface-raised:#FFFFFF;
  --border:#E2E9E6;
  --border-strong:#CDD8D3;
  --text:#101E1B;
  --text-muted:#5C6C67;
  --text-faint:#93A29D;
  --accent:#0E7C66;
  --accent-strong:#0A5F4E;
  --accent-soft:#E4F3EE;
  --accent-soft-strong:#C9EAE0;
  --beginner:#3178C6;
  --intermediate:#C4791E;
  --advanced:#C0392B;
  --status-0:#E2E9E6;
  --status-1:#BFE0D6;
  --status-2:#6FBBA4;
  --status-3:#0E7C66;
  --radius-sm:8px;
  --radius:14px;
  --radius-lg:20px;
  --shadow-sm: 0 1px 2px rgba(16,30,27,0.06);
  --shadow: 0 2px 8px rgba(16,30,27,0.06), 0 10px 24px rgba(16,30,27,0.05);
  --shadow-lg: 0 12px 32px rgba(16,30,27,0.14);
  --font-display: 'Newsreader', Georgia, serif;
  --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
}
[data-theme="dark"]{
  --bg:#0B1210;
  --bg-soft:#0F1815;
  --surface:#121C19;
  --surface-raised:#16211D;
  --border:#233029;
  --border-strong:#2E3C34;
  --text:#EAF2EF;
  --text-muted:#96A8A1;
  --text-faint:#5E706A;
  --accent:#2FBE9C;
  --accent-strong:#5CD4B4;
  --accent-soft:#132B24;
  --accent-soft-strong:#173B31;
  --status-0:#20302A;
  --status-1:#1D4A3C;
  --status-2:#28806A;
  --status-3:#2FBE9C;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow: 0 4px 16px rgba(0,0,0,0.35);
  --shadow-lg: 0 16px 40px rgba(0,0,0,0.5);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
  

<button id="backBtn" class="back-btn">‹</button>
h1,h2,h3,.serif{font-family:var(--font-display); font-weight:500; letter-spacing:-0.01em;}
code,.mono{font-family:var(--font-mono);}
a{color:inherit;}
button{font-family:var(--font-ui); cursor:pointer;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
::selection{background:var(--accent-soft-strong);}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

/* ============ APP SHELL ============ */
#app{display:flex; height:100vh; width:100vw;}

/* Sidebar */
#sidebar{
  width:236px; flex:none; background:var(--bg-soft); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:20px 12px; gap:2px; overflow-y:auto;
}
.brand{ display:flex; align-items:center; gap:10px; padding:6px 10px 18px 10px; }
.brand-mark{
  width:34px;height:34px;border-radius:10px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;flex:none;
  color:#fff; font-family:var(--font-display); font-size:18px; font-weight:600;
}
.brand-name{font-family:var(--font-display); font-size:16.5px; font-weight:600; line-height:1.15;}
.brand-sub{font-size:10.5px; color:var(--text-faint); font-family:var(--font-mono); letter-spacing:0.02em;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:10px;
  color:var(--text-muted); font-size:13.5px; font-weight:500; border:none; background:none; text-align:left; width:100%;
  transition:background .12s ease, color .12s ease;
}
.nav-item svg{width:17px;height:17px;flex:none;opacity:.85;}
.nav-item:hover{background:var(--surface-raised); color:var(--text);}
.nav-item.active{background:var(--accent-soft); color:var(--accent-strong); font-weight:600;}
.nav-group-label{font-size:10.5px; text-transform:uppercase; color:var(--text-faint); letter-spacing:0.08em; padding:16px 11px 6px; font-weight:600;}
.sidebar-foot{margin-top:auto; padding-top:10px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:2px;}

/* Main */
#main{flex:1; overflow-y:auto; position:relative; height:100vh;}
.topbar{
  position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:14px; padding:12px 28px; min-height:58px;
}
.topbar h2{font-size:17px; margin:0;}
.topbar .path{font-size:12px; color:var(--text-faint); font-family:var(--font-mono);}
.icon-btn{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center; color:var(--text-muted);
}
.icon-btn:hover{border-color:var(--border-strong); color:var(--text);}
.icon-btn svg{width:16px;height:16px;}
.view{padding:0 28px 60px; max-width:1180px; margin:0 auto;}
.view.wide{max-width:none; padding-left:0; padding-right:0;}

/* ============ HOME ============ */
.hero{padding:64px 0 40px; text-align:left;}
.hero .eyebrow{font-family:var(--font-mono); font-size:12px; color:var(--accent); letter-spacing:0.02em; margin-bottom:14px; display:flex; align-items:center; gap:8px;}
.hero .eyebrow::before{content:""; width:6px;height:6px;border-radius:50%; background:var(--accent); display:inline-block;}
.hero h1{font-size:46px; line-height:1.08; margin:0 0 14px; max-width:640px;}
.hero p.sub{font-size:16px; color:var(--text-muted); max-width:520px; line-height:1.55; margin:0 0 30px;}
.search-shell{position:relative; max-width:560px;}
.search-box{
  display:flex; align-items:center; gap:10px; border:1.5px solid var(--border-strong); border-radius:14px;
  padding:13px 16px; background:var(--surface); box-shadow:var(--shadow-sm);
}
.search-box:focus-within{border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft);}
.search-box svg{width:17px;height:17px; color:var(--text-faint); flex:none;}
.search-box input{border:none; outline:none; background:none; font-size:15px; width:100%; color:var(--text); font-family:var(--font-ui);}
.search-suggest{
  position:absolute; top:calc(100% + 8px); left:0; right:0; background:var(--surface); border:1px solid var(--border);
  border-radius:12px; box-shadow:var(--shadow-lg); overflow:hidden; z-index:30; max-height:320px; overflow-y:auto;
}
.search-suggest .row{padding:10px 16px; font-size:14px; display:flex; justify-content:space-between; align-items:center;}
.search-suggest .row:hover, .search-suggest .row.hi{background:var(--accent-soft); cursor:pointer;}
.search-suggest .row .tag{font-size:10.5px; font-family:var(--font-mono); color:var(--text-faint);}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px;}
.chip{
  padding:6px 13px; border-radius:100px; border:1px solid var(--border-strong); font-size:12.5px; color:var(--text-muted);
  background:var(--surface);
}
.chip:hover{border-color:var(--accent); color:var(--accent-strong); background:var(--accent-soft);}

.section-head{display:flex; align-items:baseline; justify-content:space-between; margin:44px 0 16px;}
.section-head h2{font-size:21px; margin:0;}
.section-head .hint{font-size:12.5px; color:var(--text-faint);}

.cat-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:14px;}
.cat-card{
  border:1px solid var(--border); border-radius:var(--radius); padding:18px; background:var(--surface);
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease; cursor:pointer;
}
.cat-card:hover{transform:translateY(-2px); box-shadow:var(--shadow); border-color:var(--border-strong);}
.cat-card .icon{width:34px;height:34px;border-radius:9px; background:var(--accent-soft); color:var(--accent-strong); display:flex; align-items:center; justify-content:center; margin-bottom:12px;}
.cat-card .icon svg{width:17px;height:17px;}
.cat-card h3{font-size:15.5px; margin:0 0 4px; font-family:var(--font-ui); font-weight:600;}
.cat-card p{font-size:12.5px; color:var(--text-muted); margin:0 0 10px; line-height:1.5;}
.cat-card .roles{font-size:11.5px; color:var(--text-faint); font-family:var(--font-mono);}

/* mini graph preview on homepage */
.preview-graph{border:1px solid var(--border); border-radius:var(--radius-lg); margin-top:40px; background:
  radial-gradient(circle at 15% 30%, var(--accent-soft), transparent 55%), var(--bg-soft);
  padding:0; overflow:hidden; height:260px; position:relative;}
.preview-graph svg{width:100%; height:100%;}

/* ============ CAREER GRID / EXPLORER ============ */
.filter-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
.filter-pill{
  padding:6px 13px; border-radius:100px; border:1px solid var(--border); font-size:12.5px; background:var(--surface); color:var(--text-muted);
}
.filter-pill.active{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
.role-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; margin-top:20px;}
.role-card{
  border:1px solid var(--border); border-radius:var(--radius); padding:16px; background:var(--surface); position:relative;
  transition:box-shadow .15s ease, border-color .15s ease;
}
.role-card:hover{box-shadow:var(--shadow); border-color:var(--border-strong);}
.role-card h4{margin:0 0 6px; font-size:14.5px; font-weight:600; font-family:var(--font-ui);}
.role-card .cat{font-size:11px; color:var(--accent-strong); font-family:var(--font-mono); margin-bottom:10px; display:block;}
.role-card .diff{font-size:11px; color:var(--text-faint);}
.role-card .go{
  margin-top:12px; font-size:12.5px; font-weight:600; color:var(--accent-strong); display:flex; align-items:center; gap:4px;
}
.role-card .ready-badge{position:absolute; top:14px; right:14px; font-size:10.5px; font-family:var(--font-mono); color:var(--text-faint);}

/* ============ CAREER DETAIL ============ */
.role-hero{display:flex; align-items:flex-start; justify-content:space-between; gap:24px; padding:36px 0 20px; flex-wrap:wrap;}
.role-hero h1{font-size:34px; margin:0 0 8px;}
.role-hero .cat-tag{font-family:var(--font-mono); font-size:12px; color:var(--accent-strong); margin-bottom:10px; display:block;}
.role-hero p{max-width:600px; color:var(--text-muted); line-height:1.6; font-size:14.5px;}
.role-meta{display:flex; gap:26px; margin-top:18px; flex-wrap:wrap;}
.role-meta .m{font-size:12px;}
.role-meta .m b{display:block; font-size:13.5px; color:var(--text); font-weight:600; margin-bottom:2px;}
.role-meta .m span{color:var(--text-faint);}
.ready-ring-wrap{display:flex; flex-direction:column; align-items:center; gap:6px; flex:none;}
.ready-ring-wrap .lbl{font-size:11px; color:var(--text-faint); font-family:var(--font-mono);}

.tab-row{display:flex; gap:4px; border-bottom:1px solid var(--border); margin:26px 0 0; overflow-x:auto;}
.tab-btn{padding:10px 16px; font-size:13px; font-weight:600; color:var(--text-faint); border:none; background:none; border-bottom:2px solid transparent; white-space:nowrap;}
.tab-btn.active{color:var(--accent-strong); border-color:var(--accent);}
.tab-panel{padding:26px 0 10px;}

.skill-pill-grid{display:flex; flex-wrap:wrap; gap:10px;}
.skill-pill{
  display:flex; align-items:center; gap:8px; padding:9px 14px; border:1px solid var(--border); border-radius:11px; background:var(--surface); font-size:13px;
}
.skill-pill .stars{font-size:10px; color:var(--accent); letter-spacing:1px;}
.skill-pill .status-dot{width:8px;height:8px;border-radius:50%; flex:none;}

.proj-cols{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.proj-col h5{font-size:11.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint); margin:0 0 10px; font-weight:700;}
.proj-item{border:1px solid var(--border); border-radius:10px; padding:11px 13px; margin-bottom:8px; font-size:13px; display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--surface);}
.proj-item .cb{width:16px;height:16px; border-radius:5px; border:1.5px solid var(--border-strong); flex:none;}
.proj-item.done{border-color:var(--accent); background:var(--accent-soft);}
.proj-item.done .cb{background:var(--accent); border-color:var(--accent);}

.interview-list{display:flex; flex-direction:column; gap:8px;}
.interview-item{border:1px solid var(--border); border-radius:10px; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; background:var(--surface); font-size:13.5px;}
.interview-item .cb{width:16px;height:16px; border-radius:5px; border:1.5px solid var(--border-strong); flex:none;}
.interview-item.done{border-color:var(--accent); background:var(--accent-soft);}
.interview-item.done .cb{background:var(--accent); border-color:var(--accent);}

/* ============ MIND MAP ============ */
.map-toolbar{display:flex; align-items:center; gap:10px; padding:12px 20px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
.map-toolbar select{
  border:1px solid var(--border-strong); border-radius:9px; padding:8px 12px; background:var(--surface); font-size:13px; color:var(--text); font-family:var(--font-ui);
}
.map-toolbar .spacer{flex:1;}
.legend{display:flex; gap:14px; align-items:center; font-size:11.5px; color:var(--text-muted);}
.legend .dot{width:9px;height:9px;border-radius:50%; display:inline-block; margin-right:5px;}
.map-canvas-wrap{position:relative; width:100%; height:calc(100vh - 160px); overflow:auto; background:
  radial-gradient(circle, var(--border) 1px, transparent 1px) 0 0/22px 22px, var(--bg);}
.map-canvas-wrap svg{display:block;}
.mm-node-rect{fill:var(--surface); stroke:var(--border-strong); stroke-width:1.4; rx:11; transition:stroke .12s ease, fill .12s ease;}
.mm-node-rect.root{fill:var(--accent); stroke:var(--accent);}
.mm-node-rect:hover{stroke:var(--accent);}
.mm-link{fill:none; stroke:var(--border-strong); stroke-width:1.6;}
.mm-label{font-family:var(--font-ui); font-size:12.5px; fill:var(--text); pointer-events:none; font-weight:500;}
.mm-label.root{fill:#fff; font-weight:700; font-size:13.5px;}
.mm-sub{font-family:var(--font-mono); font-size:9.5px; fill:var(--text-faint); pointer-events:none;}
.mm-toggle{cursor:pointer;}
.mm-toggle circle{fill:var(--surface); stroke:var(--border-strong); stroke-width:1.2;}
.mm-toggle text{font-size:11px; fill:var(--text-muted); font-family:var(--font-mono);}
.mm-status-ring{fill:none; stroke-width:3;}
.mm-node{cursor:pointer;}

/* Detail panel */
#overlay{position:fixed; inset:0; background:rgba(10,18,16,0.28); z-index:60; opacity:0; pointer-events:none; transition:opacity .18s ease;}
#overlay.show{opacity:1; pointer-events:auto;}
#detail-panel{
  position:fixed; top:0; right:0; height:100vh; width:400px; max-width:92vw; background:var(--surface); z-index:61;
  box-shadow:var(--shadow-lg); transform:translateX(100%); transition:transform .2s ease; overflow-y:auto; border-left:1px solid var(--border);
}
#detail-panel.show{transform:translateX(0);}
.dp-head{padding:22px 22px 14px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); z-index:2;}
.dp-head .close{position:absolute; top:18px; right:18px;}
.dp-cat{font-family:var(--font-mono); font-size:11px; color:var(--accent-strong); text-transform:uppercase; letter-spacing:0.04em;}
.dp-head h3{font-size:21px; margin:8px 0 0;}
.dp-body{padding:18px 22px 40px;}
.dp-row{margin-bottom:22px;}
.dp-row .k{font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint); font-weight:700; margin-bottom:8px;}
.dp-stars{color:var(--accent); font-size:15px; letter-spacing:2px;}
.dp-tag-row{display:flex; flex-wrap:wrap; gap:6px;}
.dp-tag{font-size:11.5px; padding:5px 10px; border-radius:100px; background:var(--accent-soft); color:var(--accent-strong); font-weight:500;}
.dp-tag.muted{background:var(--bg-soft); color:var(--text-muted);}
.status-track{display:flex; gap:6px;}
.status-opt{
  flex:1; text-align:center; padding:8px 4px; border-radius:9px; border:1.4px solid var(--border); font-size:11px; color:var(--text-muted); font-weight:600;
}
.status-opt.active{background:var(--accent); border-color:var(--accent); color:#fff;}
.dp-list{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:6px;}
.dp-list li{font-size:13px; padding:8px 10px; border-radius:8px; background:var(--bg-soft); display:flex; align-items:center; gap:8px;}
.dp-list li .b{width:5px;height:5px;border-radius:50%; background:var(--text-faint); flex:none;}

/* ============ COMPARE ============ */
.compare-picker{display:flex; gap:14px; align-items:center; margin:18px 0 30px; flex-wrap:wrap;}
.compare-picker select{padding:10px 14px; border-radius:10px; border:1px solid var(--border-strong); font-size:14px; background:var(--surface); min-width:200px; font-family:var(--font-ui);}
.compare-grid{display:grid; gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
.compare-row{display:grid; background:var(--surface);}
.compare-cell{padding:12px 16px; font-size:13px;}
.compare-cell.label{background:var(--bg-soft); font-weight:600; color:var(--text-muted); font-size:11.5px; text-transform:uppercase; letter-spacing:0.04em;}
.venn-wrap{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-top:26px;}
.venn-box{border:1px solid var(--border); border-radius:var(--radius); padding:16px;}
.venn-box h5{font-size:12.5px; margin:0 0 10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.04em;}
.venn-box.common{border-color:var(--accent); background:var(--accent-soft);}

/* ============ JOB READINESS ============ */
.readiness-hero{display:flex; align-items:center; gap:30px; padding:30px 0; flex-wrap:wrap;}
.readiness-big{font-family:var(--font-display); font-size:56px; font-weight:600; color:var(--accent-strong);}
.bar-row{display:flex; align-items:center; gap:14px; margin-bottom:14px;}
.bar-row .name{width:150px; font-size:13px; color:var(--text-muted); flex:none;}
.bar-track{flex:1; height:9px; background:var(--bg-soft); border-radius:100px; overflow:hidden;}
.bar-fill{height:100%; background:var(--accent); border-radius:100px; transition:width .4s ease;}
.bar-row .pct{width:40px; text-align:right; font-size:12px; font-family:var(--font-mono); color:var(--text-faint); flex:none;}
.gap-list{display:flex; flex-direction:column; gap:8px;}
.gap-item{display:flex; align-items:center; gap:10px; padding:10px 14px; border:1px solid var(--border); border-radius:10px; font-size:13px;}
.gap-item .n{width:22px;height:22px;border-radius:50%; background:var(--advanced); color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none;}

/* ============ SEARCH / PROJECTS / INTERVIEW / ROADMAP pages ============ */
.result-item{display:flex; justify-content:space-between; align-items:center; padding:13px 16px; border:1px solid var(--border); border-radius:11px; margin-bottom:8px; background:var(--surface);}
.result-item .path{font-size:11px; color:var(--text-faint); font-family:var(--font-mono); margin-top:2px;}
.empty-state{text-align:center; padding:70px 20px; color:var(--text-faint);}
.empty-state svg{width:38px;height:38px; margin-bottom:12px; opacity:.5;}

/* ============ AI COPILOT ============ */
#copilot-btn{
  position:fixed; bottom:24px; right:24px; z-index:50; background:var(--accent); color:#fff; border:none;
  width:54px;height:54px;border-radius:50%; box-shadow:var(--shadow-lg); display:flex; align-items:center; justify-content:center;
}
#copilot-btn svg{width:22px;height:22px;}
#copilot-panel{
  position:fixed; bottom:24px; right:24px; z-index:55; width:380px; max-width:92vw; height:560px; max-height:78vh;
  background:var(--surface); border-radius:18px; box-shadow:var(--shadow-lg); border:1px solid var(--border);
  display:none; flex-direction:column; overflow:hidden;
}
#copilot-panel.show{display:flex;}
.cp-head{padding:16px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px;}
.cp-head .mark{width:28px;height:28px;border-radius:8px; background:var(--accent); display:flex; align-items:center; justify-content:center; color:#fff;}
.cp-head .mark svg{width:14px;height:14px;}
.cp-head h4{margin:0; font-size:14px;}
.cp-head .sub{font-size:11px; color:var(--text-faint);}
.cp-body{flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:12px;}
.cp-msg{max-width:88%; font-size:13.5px; line-height:1.5; padding:10px 13px; border-radius:12px;}
.cp-msg.ai{background:var(--bg-soft); align-self:flex-start; border-bottom-left-radius:3px;}
.cp-msg.user{background:var(--accent); color:#fff; align-self:flex-end; border-bottom-right-radius:3px;}
.cp-msg ul{margin:6px 0 0; padding-left:16px;}
.cp-suggest{display:flex; flex-wrap:wrap; gap:6px; padding:0 18px 12px;}
.cp-suggest button{font-size:11px; padding:6px 10px; border-radius:100px; border:1px solid var(--border); background:var(--surface); color:var(--text-muted);}
.cp-input-row{display:flex; gap:8px; padding:12px; border-top:1px solid var(--border);}
.cp-input-row input{flex:1; border:1px solid var(--border-strong); border-radius:10px; padding:10px 12px; font-size:13px; background:var(--bg-soft); color:var(--text); font-family:var(--font-ui);}
.cp-input-row button{background:var(--accent); color:#fff; border:none; border-radius:10px; width:38px; display:flex; align-items:center; justify-content:center;}
.cp-input-row button svg{width:15px;height:15px;}

/* ============ MOBILE ============ */
#bottomnav{display:none;}
@media (max-width: 880px){
  #sidebar{display:none;}
  #app{flex-direction:column;}
  #main{height:calc(100vh - 60px); padding-bottom:10px;}
  #bottomnav{
    display:flex; height:60px; border-top:1px solid var(--border); background:var(--bg-soft); order:2;
    justify-content:space-around; align-items:center; flex:none;
  }
  #bottomnav button{background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text-faint); font-size:9.5px; flex:1;}
  #bottomnav button.active{color:var(--accent-strong);}
  #bottomnav svg{width:19px;height:19px;}
  .hero h1{font-size:32px;}
  .proj-cols{grid-template-columns:1fr;}
  #copilot-panel{width:94vw; right:3vw; height:70vh;}
  .role-hero{flex-direction:column;}
}
</style>
</head>

/* -------------------------------------------------------------------------
   STATE + PERSISTENCE
   ------------------------------------------------------------------------- */
const StatusEnum = ["not-started","learning","practicing","completed"];
const StatusWeight = {"not-started":0, "learning":0.35, "practicing":0.65, "completed":1};

const Store = {
  load(){
    try{ return JSON.parse(localStorage.getItem("ica_state")) || {progress:{}, projects:{}, interview:{}, theme:"light"}; }
    catch(e){ return {progress:{}, projects:{}, interview:{}, theme:"light"}; }
  },
  save(state){ localStorage.setItem("ica_state", JSON.stringify(state)); }
};
let state = Store.load();
function persist(){ Store.save(state); }

function nodeKey(careerId, skillId, topicId, subIdx){
  return [careerId, skillId, topicId||"", subIdx!==undefined?subIdx:""].join("::");
}
function getStatus(key){ return state.progress[key] || "not-started"; }
function setStatus(key, status){ state.progress[key] = status; persist(); }
function cycleStatus(key){
  const cur = getStatus(key); const i = StatusEnum.indexOf(cur);
  const next = StatusEnum[(i+1)%StatusEnum.length];
  setStatus(key, next);
  return next;
}

/* Compute a node's own status + aggregated status from children (for skill/topic rollups displayed on map) */
function computeSkillProgress(careerId, skillId){
  const skill = SKILLS[skillId]; if(!skill) return 0;
  let total=0, sum=0;
  skill.topics.forEach(t=>{
    const tKey = nodeKey(careerId, skillId, t.id);
    total++; sum += StatusWeight[getStatus(tKey)];
    t.subtopics.forEach((st,i)=>{
      const sKey = nodeKey(careerId, skillId, t.id, i);
      total++; sum += StatusWeight[getStatus(sKey)];
    });
  });
  const ownKey = nodeKey(careerId, skillId);
  total++; sum += StatusWeight[getStatus(ownKey)];
  return total? sum/total : 0;
}

function computeCareerReadiness(careerId){
  const career = CAREERS[careerId];
  const catAgg = {}; // catId -> {sum, weight}
  career.skills.forEach(cs=>{
    const prog = computeSkillProgress(careerId, cs.skillId); // 0..1
    const cat = cs.category;
    if(!catAgg[cat]) catAgg[cat]={sum:0, weight:0};
    catAgg[cat].sum += prog*cs.importance;
    catAgg[cat].weight += cs.importance;
  });
  // projects
  const allProjects = [...career.projects.beginner, ...career.projects.intermediate, ...career.projects.advanced];
  const doneProjects = allProjects.filter(p=> state.projects[careerId+"::"+p]).length;
  const projectPct = allProjects.length ? doneProjects/allProjects.length : 0;
  // interview
  const doneInterview = career.interview.filter(t=> state.interview[careerId+"::"+t]).length;
  const interviewPct = career.interview.length ? doneInterview/career.interview.length : 0;

  const cats = Object.keys(catAgg).map(cat=>({
    id:cat, name:(READINESS_CATS.find(r=>r.id===cat)||{name:cat}).name,
    pct: Math.round((catAgg[cat].sum/catAgg[cat].weight)*100)
  }));
  cats.push({id:"projects", name:"Projects", pct:Math.round(projectPct*100)});
  cats.push({id:"interview", name:"Interview Prep", pct:Math.round(interviewPct*100)});

  const overall = Math.round(cats.reduce((a,c)=>a+c.pct,0)/cats.length);
  return {overall, cats};
}

    box.innerHTML = matches.map(m=>`<div class="row" data-role="${m.id}"><span>${m.name}</span><span class="tag">${CATEGORIES.find(c=>c.id===m.category).name}</span></div>`).join("");

      const q = input.value.trim().toLowerCase();
      const m = allRoleEntries().find(r=>r.name.toLowerCase().includes(q));
      if(m) go("role",{id:m.id});

  });

function drawHomeGraph(){
  const wrap = document.getElementById("home-graph"); if(!wrap) return;
  const w = wrap.clientWidth||900, h = 260;
  const cx = 90, cy = h/2;
  const skills = ["Python","SQL","APIs","Cloud","DSA"];
  let svg = `<svg viewBox="0 0 ${w} ${h}">`;
  skills.forEach((s,i)=>{
    const tx = 300, ty = 40 + i*(h-80)/(skills.length-1);
    svg += `<path class="mm-link" d="M${cx+70},${cy} C${(cx+tx)/2},${cy} ${(cx+tx)/2},${ty} ${tx-56},${ty}"/>`;
  });
  svg += `<rect class="mm-node-rect root" x="${cx-70}" y="${cy-22}" width="140" height="44" rx="12"></rect>`;
  svg += `<text class="mm-label root" x="${cx}" y="${cy+5}" text-anchor="middle">YOUR ROLE</text>`;
  skills.forEach((s,i)=>{
    const tx = 300, ty = 40 + i*(h-80)/(skills.length-1);
    svg += `<rect class="mm-node-rect" x="${tx-56}" y="${ty-18}" width="112" height="36" rx="10"></rect>`;
    svg += `<text class="mm-label" x="${tx}" y="${ty+5}" text-anchor="middle">${s}</text>`;
  });
  // second layer, faded
  skills.forEach((s,i)=>{
    const tx = 300, ty = 40 + i*(h-80)/(skills.length-1);
    for(let j=0;j<2;j++){
      const tx2 = 560, ty2 = ty + (j===0?-14:14);
      svg += `<path class="mm-link" d="M${tx+56},${ty} C${(tx+tx2)/2},${ty} ${(tx+tx2)/2},${ty2} ${tx2-4},${ty2}" opacity="0.35"/>`;
    }
  });
  svg += `</svg>`;
  wrap.innerHTML = svg;
}

function ringSvg(pct, size){
  const r = size/2-6, c = 2*Math.PI*r;
  const off = c - (pct/100)*c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--bg-soft)" stroke-width="7"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="${size/2}" y="${size/2+6}" text-anchor="middle" font-family="Inter" font-size="17" font-weight="700" fill="var(--text)">${pct}%</text>
  </svg>`;
}

/* -------------------------------------------------------------------------
   MIND MAP (SVG tree with expand/collapse + click-to-inspect)
   ------------------------------------------------------------------------- */
const mapCollapse = {}; // per key -> bool collapsed

function buildTree(careerId){
  const c = CAREERS[careerId];
  const root = {id:"root", label:c.name, kind:"root", children:[]};
  c.skills.forEach(cs=>{
    const skill = SKILLS[cs.skillId];
    const skillKey = "s:"+cs.skillId;
    const skillNode = {id:skillKey, label:skill.name, kind:"skill", skillId:cs.skillId, importance:cs.importance, children:[]};
    skill.topics.forEach(t=>{
      const topicKey = "t:"+cs.skillId+":"+t.id;
      const topicNode = {id:topicKey, label:t.name, kind:"topic", skillId:cs.skillId, topicId:t.id, children:[]};
      t.subtopics.forEach((st,i)=>{
        topicNode.children.push({id:"st:"+cs.skillId+":"+t.id+":"+i, label:st, kind:"subtopic", skillId:cs.skillId, topicId:t.id, subIdx:i, children:[]});
      });
      skillNode.children.push(topicNode);
    });
    root.children.push(skillNode);
  });
  return root;
}
function layoutTree(node, careerId, mapId){
  const rowH = 34, xGap = 230;
  let leafCounter = 0;
  function assign(n, depth){
    n.depth = depth;
    const cKey = mapId+":"+n.id;
    n.isCollapsed = !!mapCollapse[cKey] && n.children.length>0;
    if(n.children.length===0 || n.isCollapsed){
      n.y = leafCounter*rowH; leafCounter++;
    } else {
      n.children.forEach(c=>assign(c, depth+1));
      n.y = (n.children[0].y + n.children[n.children.length-1].y)/2;
    }
    n.x = 60 + depth*xGap;
  }
  assign(node, 0);
  return {height: Math.max(leafCounter*rowH, 200)};
}
function statusColorFor(careerId, n){
  let key;
  if(n.kind==="skill") key = nodeKey(careerId, n.skillId);
  else if(n.kind==="topic") key = nodeKey(careerId, n.skillId, n.topicId);
  else if(n.kind==="subtopic") key = nodeKey(careerId, n.skillId, n.topicId, n.subIdx);
  else return null;
  const st = getStatus(key);
  return {"not-started":"var(--status-0)","learning":"var(--status-1)","practicing":"var(--status-2)","completed":"var(--status-3)"}[st];
}
function drawMindMap(wrapId, careerId){
  const wrap = document.getElementById(wrapId); if(!wrap) return;
  const tree = buildTree(careerId);
  const {height} = layoutTree(tree, careerId, wrapId);
  const width = Math.max(wrap.clientWidth, 60 + 4*230 + 260);
  const svgH = Math.max(height+60, wrap.clientHeight||500);

  let defs = "";
  let links = "";
  let nodes = "";

  function walk(n){
    if(n.parent){
      const p = n.parent;
      const x1 = p.x + nodeWidthFor(p), y1 = p.y+16, x2 = n.x, y2 = n.y+16;
      links += `<path class="mm-link" d="M${x1},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}"/>`;
    }
    nodes += renderNodeSvg(n, careerId, wrapId);
    if(!n.isCollapsed){ n.children.forEach(c=>{ c.parent = n; walk(c); }); }
  }
  tree.children.forEach(c=>{ c.parent = tree; });
  // draw root manually then children
  nodes += renderNodeSvg(tree, careerId, wrapId);
  tree.children.forEach(c=>{ c.parent=tree; walk(c); });

  wrap.innerHTML = `<svg width="${width}" height="${svgH}" viewBox="0 0 ${width} ${svgH}">${links}${nodes}</svg>`;

  wrap.querySelectorAll("[data-toggle]").forEach(t=>{
    t.addEventListener("click",(e)=>{
      e.stopPropagation();
      const key = wrapId+":"+t.dataset.toggle;
      mapCollapse[key] = !mapCollapse[key];
      drawMindMap(wrapId, careerId);
    });
  });
  wrap.querySelectorAll("[data-node]").forEach(g=>{
    g.addEventListener("click",()=>{
      const d = JSON.parse(g.dataset.node);
      openDetail({type:d.kind, careerId, skillId:d.skillId, topicId:d.topicId, subIdx:d.subIdx});
    });
  });
}
function nodeWidthFor(n){ return n.kind==="root"?160: n.kind==="skill"?190: n.kind==="topic"?190:230; }
function renderNodeSvg(n, careerId, wrapId){
  const w = nodeWidthFor(n), hgt = 32;
  const x = n.x, y = n.y;
  const isRoot = n.kind==="root";
  const color = isRoot? null : statusColorFor(careerId, n);
  const importanceDots = n.kind==="skill" ? `<g transform="translate(${x+w-8-n.importance*7},${y+hgt-8})">${Array.from({length:n.importance}).map((_,i)=>`<circle cx="${i*7}" cy="0" r="2" fill="var(--accent)"></circle>`).join("")}</g>` : "";
  const hasChildren = n.children && n.children.length>0;
  const nodeData = JSON.stringify({kind:n.kind, skillId:n.skillId, topicId:n.topicId, subIdx:n.subIdx}).replace(/"/g,"&quot;");
  let out = `<g class="mm-node" data-node="${nodeData}">
    <rect class="mm-node-rect ${isRoot?'root':''}" x="${x}" y="${y}" width="${w}" height="${hgt}" rx="10"
      ${color?`style="stroke:${color}; stroke-width:2;"`:""}></rect>
    <text class="mm-label ${isRoot?'root':''}" x="${x+14}" y="${y+hgt/2+4}">${truncate(n.label, n.kind==="root"?18:22)}</text>
    ${importanceDots}
  </g>`;
  if(hasChildren){
    out += `<g class="mm-toggle" data-toggle="${n.id}" transform="translate(${x+w},${y+hgt/2})">
      <circle r="9"></circle>
      <text x="0" y="4" text-anchor="middle">${n.isCollapsed?"+":"–"}</text>
    </g>`;
  }
  return out;
}
function truncate(s,n){ return s.length>n? s.slice(0,n-1)+"…" : s; }

  if(type==="skill"){
    title = skill.name; catLabel = "SKILL";
    const cs = CAREERS[careerId].skills.find(s=>s.skillId===skillId);
    importanceStars = cs? cs.importance : 3;
    difficulty = skill.difficulty;
    statusKey = nodeKey(careerId, skillId);
    coreList = skill.topics.map(t=>t.name);

    statusKey = nodeKey(careerId, skillId, topicId);

    const topic = skill.topics.find(t=>t.id===topicId);
    title = topic.subtopics[subIdx]; catLabel = "SUBTOPIC · "+topic.name.toUpperCase();
    const cs = CAREERS[careerId].skills.find(s=>s.skillId===skillId);
    importanceStars = cs? cs.importance : 3;
    difficulty = skill.difficulty;
    statusKey = nodeKey(careerId, skillId, topicId, subIdx);
    coreList = [];
    breadcrumb = CAREERS[careerId].name+" / "+skill.name+" / "+topic.name;
  }

  const curStatus = getStatus(statusKey);
  panel.innerHTML = `
    <div class="dp-head">
      <button class="icon-btn close" id="dp-close">${icon("x")}</button>
      <span class="dp-cat mono">${catLabel}</span>

      </div>

        <div class="k">Difficulty</div>
        <div class="dp-tag ${difficulty==='Advanced'?'':''}" style="background:var(--accent-soft); color:var(--accent-strong);">${difficulty}</div>
      </div>
      ${relatedCareers.length? `<div class="dp-row">
        <div class="k">Required for</div>
        <div class="dp-tag-row">${relatedCareers.map(r=>`<span class="dp-tag muted">${r}</span>`).join("")}</div>
      </div>`:""}
      ${coreList.length? `<div class="dp-row">
        <div class="k">${type==="skill"?"Core topics":"Subtopics"}</div>
        <ul class="dp-list">${coreList.map(c=>`<li><span class="b"></span>${c}</li>`).join("")}</ul>
      </div>`:""}
      <div class="dp-row">
        <div class="k">Learning status</div>

          ${StatusEnum.map(s=>`<button class="status-opt ${curStatus===s?'active':''}" data-status="${s}">${statusLabel(s)}</button>`).join("")}
        </div>
      </div>
    </div>
  `;
  document.getElementById("dp-close").addEventListener("click", closePanel);

    setStatus(statusKey, b.dataset.status);

  }));

// Build a path following prerequisite-ish ordering: foundation -> language -> dsa -> domain skills -> systemdesign -> projects/interview
function generatePath(careerId, expLevel, hoursPerWeek){
  const career = CAREERS[careerId];
  const order = ["foundation","programming","database","backend","data","ml","cloud","security","testing","dsa","systemdesign"];
  let skillsSorted = [...career.skills].sort((a,b)=> order.indexOf(a.category)-order.indexOf(b.category) || b.importance-a.importance);
  if(expLevel>=1) skillsSorted = skillsSorted.filter(s=> !(s.category==="foundation")); // skip pure basics if some experience
  if(expLevel>=2) skillsSorted = skillsSorted.filter(s=> s.importance>=3 || s.category==="dsa"); // intermediate: focus on essentials
  const topicsPerWeek = hoursPerWeek>=20? 3 : hoursPerWeek>=10? 2 : 1;
  const items = [];
  skillsSorted.forEach(cs=>{
    const skill = SKILLS[cs.skillId];
    skill.topics.forEach(t=> items.push(`${skill.name}: ${t.name}`));
  });
  items.push(`Projects: ${career.projects.beginner[0]}`);
  items.push(`Projects: ${career.projects.intermediate[0]}`);
  items.push(`Interview prep: ${career.interview.slice(0,3).join(", ")}`);

  const weeks = [];
  let cursor = 1;
  for(let i=0;i<items.length;i+=topicsPerWeek){
    const chunk = items.slice(i,i+topicsPerWeek);
    weeks.push({range: cursor, items: chunk});
    cursor++;
  }
  return weeks;
}

/* -------------------------------------------------------------------------
   VIEW: SEARCH
   ------------------------------------------------------------------------- */
function buildSearchIndex(){
  const idx = [];
  Object.entries(CAREERS).forEach(([id,c])=> idx.push({type:"Career", label:c.name, path:"Career Explorer", action:()=>go("role",{id})}));
  Object.entries(SKILLS).forEach(([id,s])=> idx.push({type:"Skill", label:s.name, path:"Skills", action:()=>{ const cid=(SKILL_CAREERS[id]||[])[0]; if(cid) openDetail({type:"skill", careerId:cid, skillId:id}); }}));
  Object.entries(SKILLS).forEach(([sid,s])=> s.topics.forEach(t=> idx.push({type:"Topic", label:t.name, path:s.name, action:()=>{ const cid=(SKILL_CAREERS[sid]||[])[0]; if(cid) openDetail({type:"topic", careerId:cid, skillId:sid, topicId:t.id}); }})));
  return idx;
}
const SEARCH_INDEX = buildSearchIndex();
function renderSearch(){
  renderTopbar("Search", "Careers, skills, topics & subtopics");
  const el = document.getElementById("content");
  el.innerHTML = `
    <div style="padding-top:22px;">
      <div class="search-box" style="max-width:560px;">${icon("search")}<input id="global-search" placeholder="Search the entire knowledge base…" autocomplete="off"></div>
      <div id="search-results" style="margin-top:22px;"></div>
    </div>
  `;
  const input = document.getElementById("global-search");
  const results = document.getElementById("search-results");
  function draw(q){
    if(!q){ results.innerHTML = `<div class="empty-state">${icon("search")}<div>Start typing to search across roles, skills and topics.</div></div>`; return; }
    const matches = SEARCH_INDEX.filter(m=>m.label.toLowerCase().includes(q.toLowerCase())).slice(0,40);
    if(!matches.length){ results.innerHTML = `<div class="empty-state">${icon("search")}<div>No results for “${q}”.</div></div>`; return; }
    results.innerHTML = matches.map((m,i)=>`<div class="result-item" data-i="${i}"><div><div>${m.label}</div><div class="path">${m.type} · ${m.path}</div></div>${icon("chevronRight")}</div>`).join("");
    results.querySelectorAll("[data-i]").forEach(r=>r.addEventListener("click",()=>matches[+r.dataset.i].action()));
  }
  input.addEventListener("input",()=>draw(input.value.trim()));
  draw("");
}

/* -------------------------------------------------------------------------
   AI CAREER COPILOT (rule-based over the knowledge graph — no external calls)
   ------------------------------------------------------------------------- */
let cpHistory = [];
let cpContext = {careerId:null};
function renderCopilot(){
  document.getElementById("copilot-btn").innerHTML = icon("bot");
  const panel = document.getElementById("copilot-panel");
  panel.innerHTML = `
    <div class="cp-head">
      <div class="mark">${icon("bot")}</div>
      <div><h4>Career Copilot</h4><div class="sub">Ask about roles, skills & what's next</div></div>
      <div class="spacer"></div>
      <button class="icon-btn" id="cp-close">${icon("x")}</button>
    </div>
    <div class="cp-body" id="cp-body"></div>
    <div class="cp-suggest" id="cp-suggest">
      ${["What do I need for Backend Engineer?","Compare Backend and Data Engineer","I know Python and SQL. What's next?","What can I skip for frontend?"].map(q=>`<button data-q="${q}">${q}</button>`).join("")}
    </div>
    <div class="cp-input-row">
      <input id="cp-input" placeholder="Ask the copilot…">
      <button id="cp-send">${icon("send")}</button>
    </div>
  `;
  document.getElementById("cp-close").addEventListener("click", ()=>panel.classList.remove("show"));
  document.getElementById("cp-suggest").querySelectorAll("[data-q]").forEach(b=>b.addEventListener("click",()=>askCopilot(b.dataset.q)));
  document.getElementById("cp-send").addEventListener("click", sendCopilotInput);
  document.getElementById("cp-input").addEventListener("keydown",(e)=>{ if(e.key==="Enter") sendCopilotInput(); });
  if(cpHistory.length===0){
    pushCpMsg("ai", "Hi — I'm your Career Copilot. Ask me what a role needs, how two careers compare, or what to learn next based on skills you already know.");
  } else {
    renderCpHistory();
  }
}
function sendCopilotInput(){
  const input = document.getElementById("cp-input");
  const q = input.value.trim(); if(!q) return;
  input.value = "";
  askCopilot(q);
}
function pushCpMsg(role, html){
  cpHistory.push({role, html});
  renderCpHistory();
}
function renderCpHistory(){
  const body = document.getElementById("cp-body"); if(!body) return;
  body.innerHTML = cpHistory.map(m=>`<div class="cp-msg ${m.role}">${m.html}</div>`).join("");
  body.scrollTop = body.scrollHeight;
}
function findCareerInText(q){
  const lower = q.toLowerCase();
  return Object.entries(CAREERS).find(([id,c])=> lower.includes(c.name.toLowerCase()) || lower.includes(id.replace("-"," ")))?.[0];
}
function findAllCareersInText(q){
  const lower = q.toLowerCase();
  return Object.entries(CAREERS).filter(([id,c])=> lower.includes(c.name.toLowerCase())).map(([id])=>id);
}
function findSkillsInText(q){
  const lower = q.toLowerCase();
  return Object.entries(SKILLS).filter(([id,s])=> lower.includes(s.name.toLowerCase())).map(([id])=>id);
}
function askCopilot(q){
  pushCpMsg("user", escapeHtml(q));
  const lower = q.toLowerCase();
  const careersMentioned = findAllCareersInText(q);
  let careerId = careersMentioned[0] || cpContext.careerId;

  setTimeout(()=>{
    let answer = "";
    if(careersMentioned.length>=2){
      answer = copilotCompare(careersMentioned[0], careersMentioned[1]);
    } else if(/compare/.test(lower) && careerId){
      answer = "Tell me two roles to compare, e.g. “Compare Backend Engineer and Data Engineer.”";
    } else if(/what should i (learn|do) next|next step|what.?s next/.test(lower)){
      const knownSkills = findSkillsInText(q);
      answer = copilotWhatsNext(careerId, knownSkills);
    } else if(/skip|don.?t need|optional/.test(lower)){
      answer = copilotOptional(careerId);
    } else if(/why (do i need|is|learn)/.test(lower)){
      const skillIds = findSkillsInText(q);
      answer = copilotWhy(careerId, skillIds[0]);
    } else if(/ready|readiness|job.?ready/.test(lower) && careerId){
      const r = computeCareerReadiness(careerId);
      answer = `You're at <b>${r.overall}%</b> job-ready for ${CAREERS[careerId].name}. Your weakest areas: ${[...r.cats].sort((a,b)=>a.pct-b.pct).slice(0,2).map(c=>c.name).join(", ")}. Check the <b>Job Readiness</b> tab for the full breakdown.`;
    } else if(/(roadmap|path|plan)/.test(lower) && careerId){
      const skills = CAREERS[careerId].skills.sort((a,b)=>b.importance-a.importance).slice(0,6);
      answer = `A solid path to <b>${CAREERS[careerId].name}</b> usually starts with: <ul>${skills.map(s=>`<li>${SKILLS[s.skillId].name}</li>`).join("")}</ul>Open <b>My Roadmap</b> to generate a personalized, week-by-week plan based on your time and experience.`;
    } else if(/common|shared|overlap/.test(lower) && careersMentioned.length===0){
      answer = "Tell me which two roles, and I'll show the skills they share — e.g. “What skills are common between ML Engineer and GenAI Engineer?”";
    } else if(/which career.*python|python.*most/.test(lower)){
      const python = SKILL_CAREERS["python"]||[];
      answer = `Python shows up heavily in: ${python.map(c=>CAREERS[c].name).join(", ")}.`;
    } else if(careerId){
      answer = copilotOverview(careerId);
      cpContext.careerId = careerId;
    } else {
      answer = `I can help with things like: <ul><li>“What do I need for &lt;role&gt;?”</li><li>“Compare &lt;role A&gt; and &lt;role B&gt;”</li><li>“I know Python and SQL — what's next?”</li><li>“Am I ready for a &lt;role&gt; internship?”</li></ul>Try naming a specific role.`;
    }
    pushCpMsg("ai", answer);
  }, 260);
}
function copilotOverview(careerId){
  const c = CAREERS[careerId];
  const essentials = c.skills.filter(s=>s.importance>=4).map(s=>SKILLS[s.skillId].name);
  return `<b>${c.name}</b> — ${c.description}<br><br>Essential skills: ${essentials.join(", ")}.<br>Typical scope: ~${c.scopeWeeks} weeks. Difficulty: ${c.difficulty}.<br><br>Open the <b>Career Map</b> to explore the full interactive roadmap.`;
}
function copilotCompare(idA, idB){
  const ca = CAREERS[idA], cb = CAREERS[idB];
  const setA = new Set(ca.skills.map(s=>s.skillId)), setB = new Set(cb.skills.map(s=>s.skillId));
  const common = [...setA].filter(s=>setB.has(s)).map(s=>SKILLS[s].name);
  const onlyA = [...setA].filter(s=>!setB.has(s)).map(s=>SKILLS[s].name);
  const onlyB = [...setB].filter(s=>!setA.has(s)).map(s=>SKILLS[s].name);
  return `<b>${ca.name}</b> vs <b>${cb.name}</b><br><br>Shared: ${common.join(", ")||"—"}<br>${ca.name}-only: ${onlyA.join(", ")||"—"}<br>${cb.name}-only: ${onlyB.join(", ")||"—"}<br><br>Open <b>Compare</b> for a side-by-side view.`;
}
function copilotWhatsNext(careerId, knownSkillIds){
  if(!careerId){ return "Which role are you aiming for? Name one and tell me what you already know."; }
  const c = CAREERS[careerId];
  const known = new Set(knownSkillIds);
  const remaining = c.skills.filter(s=>!known.has(s.skillId)).sort((a,b)=>b.importance-a.importance);
  if(!remaining.length) return `You've covered the core skill list for ${c.name} — focus on projects and interview prep next.`;
  return `Given what you know, for <b>${c.name}</b> I'd learn next, in order:<ul>${remaining.slice(0,5).map(s=>`<li>${SKILLS[s.skillId].name} <span class="mono" style="color:var(--text-faint); font-size:11px;">(${"★".repeat(s.importance)})</span></li>`).join("")}</ul>`;
}
function copilotOptional(careerId){
  if(!careerId) return "Tell me which role, and I'll flag which skills are optional versus essential for it.";
  const c = CAREERS[careerId];
  const optional = c.skills.filter(s=>s.importance<=2).map(s=>SKILLS[s.skillId].name);
  return optional.length? `For <b>${c.name}</b>, lower-priority (optional/advanced-later) skills include: ${optional.join(", ")}. Everything else is essential or strongly recommended.` : `For ${c.name}, most listed skills are essential — there isn't much you can safely skip.`;
}
function copilotWhy(careerId, skillId){
  if(!skillId) return "Which skill are you asking about? Name it directly, e.g. “Why do I need Docker?”";
  const skill = SKILLS[skillId];
  const careers = SKILL_CAREERS[skillId]||[];
  const cs = careerId && CAREERS[careerId].skills.find(s=>s.skillId===skillId);
  return `<b>${skill.name}</b> is used across: ${careers.map(c=>CAREERS[c].name).join(", ")}.${cs?` For ${CAREERS[careerId].name} specifically it's rated ${"★".repeat(cs.importance)}${"☆".repeat(5-cs.importance)} importance.`:""} Core topics: ${skill.topics.slice(0,4).map(t=>t.name).join(", ")}.`;
}
function escapeHtml(s){ const d=document.createElement("div"); d.innerText=s; return d.innerHTML; }

/* -------------------------------------------------------------------------
   MAIN RENDER / INIT
   ------------------------------------------------------------------------- */
function render(skipTopScroll){
  document.getElementById("content").classList.remove("wide");
  renderSidebar(); renderBottomNav();
  switch(route.view){
    case "home": renderHome(); break;
    case "home-cat": renderHomeCat(route.params.id); break;
    case "role": renderRole(route.params.id); break;
    case "map": renderMapView(); break;
    case "skills": renderSkillsView(); break;
    case "compare": renderCompare(); break;
    case "roadmap": renderRoadmap(); break;
    case "readiness": renderReadiness(); break;
    case "projects": renderProjectsView(); break;
    case "interview": renderInterviewView(); break;
    case "search": renderSearch(); break;
    case "settings": renderSettings(); break;
    default: renderHome();
  }
}

document.getElementById("copilot-btn").addEventListener("click", ()=>{
  const panel = document.getElementById("copilot-panel");
  panel.classList.toggle("show");

});
window.addEventListener("resize", ()=>{ if(route.view==="map") drawMindMap("main-map-wrap", route.params.id||Object.keys(CAREERS)[0]); });

render();
